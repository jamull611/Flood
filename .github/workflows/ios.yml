# Builds the iPad/iPhone app and sends it to TestFlight.
# Without the Apple secrets it only checks that the app compiles.
# Secrets (Settings > Secrets and variables > Actions): APPSTORE_KEY_ID,
# APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 (the whole .p8 file from App Store Connect > Users and Access > Integrations).
name: iPad app

on:
  push:
    branches: [main]
    paths: ['ios-app/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID || '2V38BS96MY' }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and prepare the app
        working-directory: ios-app
        run: |
          xcodebuild -version
          npm install --no-audit --no-fund
          npx cap sync ios

      - name: Check that it compiles (no Apple keys yet)
        if: env.KEY_P8 == ''
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -n 60
          exit ${PIPESTATUS[0]}

      - name: Build and send to TestFlight
        if: env.KEY_P8 != ''
        working-directory: ios-app/ios/App
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${AUTH[@]}" archive | tail -n 60
          test ${PIPESTATUS[0]} -eq 0
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" "${AUTH[@]}"
          rm -f "$KEY"
          echo "Sent build ${{ github.run_number }} to TestFlight. It shows up in the TestFlight app after Apple processes it (about 10 to 20 minutes)."
